<!DOCTYPE html>
<html>
<head>
    <title>MuzzLow Player</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>🎵 MuzzLow Player</h1>
    <input type="text" id="search" placeholder="Поиск..." size="50">
    <button>Найти</button>

    <div id="results"></div>

    <script>
        const inp = document.querySelector('input')
        const btn = document.querySelector('button')
        const res = document.querySelector('#results')

        const API_ADRESS = 'http://127.0.0.1:8000'

        async function search(q) {
            const response = await fetch(
                `${API_ADRESS}/music?q=${encodeURIComponent(q)}`
            )

            if (!response.ok) {
                throw new Error("API Error")
            }

            const data = await response.json()

            return data.audioUrl
        }

        btn.addEventListener('click', async () => {
            const q = inp.value

            if (!q) return

            res.innerHTML = "Loading..."

            try {
                const link = await search(q)

                res.innerHTML = ""

                const audio = document.createElement("audio")
                audio.controls = true
                audio.src = link

                res.appendChild(audio)

            } catch (err) {
                res.innerHTML = err
            }
        })
    </script>

</body>
</html>
